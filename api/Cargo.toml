[package]
name = "tessera-api"
version = "0.1.0"
edition = "2021"
description = "Tessera REST API indexing tokenized real-world asset activity on Stellar."
authors = ["Afolabi <afolabiaderonke1995@gmail.com>"]
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "limit", "timeout", "trace"] }
tower_governor = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
stellar-xdr = { version = "23", default-features = false, features = ["curr", "std", "base64"] }
stellar-strkey = "0.0.13"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rand = "0.9"
url = "2"
redis = { version = "1.7.1", features = ["tokio-comp"] }
async-trait = "0.1.92"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
serde_json = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "xdr_parser"
harness = false

[[bin]]
name = "tessera-api"
path = "src/main.rs"


# Issue #42: HashiCorp Vault Mid-Flight Block / Partition
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: vault-network-partition-blocked-mid-flight
  namespace: tessera-chaos
  labels:
    app.kubernetes.io/part-of: tessera
    chaos.tessera.finance/experiment: vault-network-partition
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - tessera-system
    labelSelectors:
      app.kubernetes.io/name: tessera-api

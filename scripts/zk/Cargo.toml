[package]
name = "tessera-zk-range-prover"
version = "0.1.0"
edition = "2021"
description = "Off-chain Bulletproofs balance range proof generator for Tessera (Issue #245)"

[[bin]]
name = "generate-range-proof"
path = "generate_range_proof.rs"

[dependencies]
curve25519-dalek = "5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

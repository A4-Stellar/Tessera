[package]
name = "tessera-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Tessera infrastructure automation: cross-region PostgreSQL failover controller and the automated P1 alert triage bot."
license = "Apache-2.0"

# Standalone crate, like services/mpc-signer: it is deployed next to the
# databases, not bundled with the API, so it is not a member of any workspace.
[workspace]

[dependencies]
async-trait = "0.1"
# Issue #474: HTTP listener for the triage bot's alert webhooks.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
# Issue #474: the triage bot's cache flush/restore.
redis = { version = "0.24", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[bin]]
name = "tessera-orchestrator"
path = "src/main.rs"

# Issue #474: automated P1 alert triage bot.
[[bin]]
name = "tessera-triage"
path = "src/bin/triage.rs"

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tesseradocs.operator.tessera.io
spec:
  group: operator.tessera.io
  names:
    kind: TesseraDocs
    listKind: TesseraDocsList
    plural: tesseradocs
    singular: tesseradoc
    shortNames:
      - tdoc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
                - ingressHost
              properties:
                replicas:
                  type: integer
                  minimum: 1
                image:
                  type: string
                ingressHost:
                  type: string
                enableTls:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                availableReplicas:
                  type: integer
                endpoint:
                  type: string

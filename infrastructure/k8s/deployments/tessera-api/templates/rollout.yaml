apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "tessera-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tessera-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "tessera-api.selectorLabels" . | nindent 6 }}
  {{- if eq .Values.strategy "blueGreen" }}
  strategy:
    blueGreen:
      activeService: {{ include "tessera-api.fullname" . }}
      previewService: {{ include "tessera-api.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      {{- if .Values.blueGreen.autoPromotionEnabled }}
      autoPromotionSeconds: {{ .Values.blueGreen.autoPromotionSeconds }}
      {{- end }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
      {{- if and .Values.blueGreen.prePromotionAnalysis .Values.analysis.enabled }}
      prePromotionAnalysis:
        templates:
          - templateName: {{ include "tessera-api.fullname" . }}-error-rate
          - templateName: {{ include "tessera-api.fullname" . }}-p95-latency
        args:
          - name: service-name
            value: {{ include "tessera-api.fullname" . }}-preview
      {{- end }}
      {{- if and .Values.blueGreen.postPromotionAnalysis .Values.analysis.enabled }}
      postPromotionAnalysis:
        templates:
          - templateName: {{ include "tessera-api.fullname" . }}-error-rate
          - templateName: {{ include "tessera-api.fullname" . }}-p95-latency
        args:
          - name: service-name
            value: {{ include "tessera-api.fullname" . }}
      {{- end }}
      abortScaleDownDelaySeconds: 30
  {{- else if eq .Values.strategy "canary" }}
  strategy:
    canary:
      canaryService: {{ include "tessera-api.fullname" . }}-preview
      stableService: {{ include "tessera-api.fullname" . }}
      maxSurge: {{ .Values.canary.maxSurge | quote }}
      maxUnavailable: {{ .Values.canary.maxUnavailable }}
      {{- if .Values.analysis.enabled }}
      analysis:
        templates:
          - templateName: {{ include "tessera-api.fullname" . }}-error-rate
          - templateName: {{ include "tessera-api.fullname" . }}-p95-latency
        args:
          - name: service-name
            value: {{ include "tessera-api.fullname" . }}-preview
        startingStep: 1
      {{- end }}
      steps:
        {{- range .Values.canary.steps }}
        {{- if .setWeight }}
        - setWeight: {{ .setWeight }}
        {{- end }}
        {{- if .pause }}
        - pause:
            duration: {{ .pause.duration }}
        {{- end }}
        {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "tessera-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tessera-api.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mtls.enabled }}
      initContainers:
        - name: install-spire-cli
          image: {{ .Values.mtls.spireAgentImage }}
          command: ["cp", "/opt/spire/bin/spire-agent", "/opt/spire-cli/spire-agent"]
          volumeMounts:
            - name: spire-cli
              mountPath: /opt/spire-cli
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          {{- if or .Values.env .Values.mtls.enabled .Values.vault.enabled }}
          env:
            {{- if .Values.mtls.enabled }}
            - name: SPIFFE_SVID_DIR
              value: /var/run/spiffe.svid
            - name: SPIFFE_SERVICE_NAME
              value: tessera-api
            {{- end }}
            {{- if .Values.vault.enabled }}
            - name: VAULT_ADDR
              value: {{ .Values.vault.address | quote }}
            - name: VAULT_K8S_MOUNT
              value: {{ .Values.vault.k8sMount | quote }}
            - name: VAULT_K8S_ROLE
              value: {{ .Values.vault.k8sRole | quote }}
            - name: VAULT_K8S_JWT_PATH
              value: {{ .Values.vault.serviceAccountTokenPath | quote }}
            - name: VAULT_DB_MOUNT
              value: {{ .Values.vault.databaseMount | quote }}
            - name: VAULT_PG_ROLE
              value: {{ .Values.vault.postgresRole | quote }}
            - name: VAULT_REDIS_ROLE
              value: {{ .Values.vault.redisRole | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.mtls.enabled .Values.vault.enabled }}
          volumeMounts:
            {{- if .Values.mtls.enabled }}
            - name: spiffe-svid
              mountPath: /var/run/spiffe.svid
              readOnly: true
            {{- end }}
            {{- if .Values.vault.enabled }}
            - name: vault-k8s-sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        {{- if .Values.mtls.enabled }}
        - name: spiffe-svid-writer
          image: {{ .Values.mtls.svidWriterImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CLI=/opt/spire-cli/spire-agent
              SOCKET={{ .Values.mtls.spireAgentSocket }}
              DIR=/var/run/spiffe.svid
              mkdir -p "$DIR/raw"
              while true; do
                rm -f "$DIR/raw"/*
                if "$CLI" api fetch x509 -socketPath "$SOCKET" -write "$DIR/raw" -silent; then
                  cp "$DIR/raw/svid.0.pem" "$DIR/svid.pem"
                  cp "$DIR/raw/svid.0.key" "$DIR/svid.key"
                  cp "$DIR/raw/bundle.0.pem" "$DIR/bundle.pem"
                  printf '%s' '{{ .Values.mtls.spiffeId }}' > "$DIR/spiffe_id"
                fi
                sleep {{ .Values.mtls.refreshSeconds }}
              done
          volumeMounts:
            - name: spiffe-svid
              mountPath: /var/run/spiffe.svid
            - name: spire-cli
              mountPath: /opt/spire-cli
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: envoy
          image: {{ .Values.mtls.envoy.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: mesh
              containerPort: {{ .Values.mtls.envoy.inboundPort }}
              protocol: TCP
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: spiffe-svid
              mountPath: /var/run/spiffe.svid
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        {{- end }}
      {{- if or .Values.mtls.enabled .Values.vault.enabled }}
      volumes:
        {{- if .Values.mtls.enabled }}
        - name: spiffe-svid
          emptyDir: {}
        - name: spire-cli
          emptyDir: {}
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent
            type: Directory
        - name: envoy-config
          configMap:
            name: {{ include "tessera-api.fullname" . }}-envoy
        {{- end }}
        {{- if .Values.vault.enabled }}
        # Projected ServiceAccount JWT for HashiCorp Vault Kubernetes auth (#423).
        # No Kubernetes Secret objects are used; DB/Redis credentials never touch etcd.
        - name: vault-k8s-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.vault.tokenExpirationSeconds | default 3600 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessera-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tessera-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tessera-api.selectorLabels" . | nindent 4 }}
---
{{- if .Values.previewService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessera-api.fullname" . }}-preview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tessera-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.previewService.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tessera-api.selectorLabels" . | nindent 4 }}
{{- end }}

# -- Tessera API Helm values for Argo Rollouts blue-green / canary deployment.

replicaCount: 3

image:
  repository: ghcr.io/a4-stellar/tessera-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Deployment strategy: "blueGreen" or "canary".
strategy: blueGreen

blueGreen:
  autoPromotionEnabled: false
  autoPromotionSeconds: 120
  scaleDownDelaySeconds: 30
  prePromotionAnalysis: true
  postPromotionAnalysis: false

canary:
  steps:
    - setWeight: 10
    - pause: { duration: 60s }
    - setWeight: 30
    - pause: { duration: 60s }
    - setWeight: 60
    - pause: { duration: 60s }
    - setWeight: 100
  maxSurge: "25%"
  maxUnavailable: 0

analysis:
  enabled: true
  # -- Maximum HTTP 5xx error rate (percentage) before aborting.
  errorRateThreshold: 1.0
  # -- Maximum p95 latency in milliseconds before aborting.
  p95LatencyThresholdMs: 500
  # -- How often to sample metrics during analysis.
  intervalSeconds: 30
  # -- Number of metric samples to collect per analysis run.
  count: 10
  # -- Number of failures allowed before the analysis is considered failed.
  failureLimit: 2
  # -- Prometheus endpoint for metric queries.
  prometheusAddress: http://prometheus.monitoring.svc.cluster.local:9090

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

previewService:
  enabled: true
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

env:
  - name: RUST_LOG
    value: "tessera_api=info,tower_http=info"
  - name: PORT
    value: "8080"

envFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

serviceAccount:
  create: true
  # -- Must match the SPIRE registration entry: spiffe://tessera.io/ns/prod/sa/tessera-api
  name: "tessera-api"
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 2

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# -- SPIFFE X.509 SVID writer and Envoy mTLS sidecar (issue #394).
# Requires the SPIRE manifests in ../../spire to be installed first.
mtls:
  enabled: false
  spiffeId: "spiffe://tessera.io/ns/prod/sa/tessera-api"
  # -- Path to the agent socket exposed on the host by the SPIRE DaemonSet.
  spireAgentSocket: "/run/spire/agent/agent.sock"
  # -- Refresh cadence for short-lived SVIDs (must be shorter than the SPIRE TTL).
  refreshSeconds: 240
  spireAgentImage: "ghcr.io/spiffe/spire-agent:1.8.1"
  svidWriterImage: "busybox:1.36"
  envoy:
    image: "envoyproxy/envoy:v1.31-latest"
    # -- Service target port when the sidecar is enabled; traffic is mTLS to
    # the sidecar, then plain HTTP to the application container.
    inboundPort: 8443

# -- HashiCorp Vault dynamic secrets for PostgreSQL and Redis (issue #423).
# Database and Redis credentials are fetched in-memory via the pod's projected
# Kubernetes ServiceAccount JWT (POST /v1/auth/kubernetes/login) with 1h TTLs
# and renewed via PUT /v1/sys/leases/renew. Zero Kubernetes Secret objects are
# created or mounted so credentials never touch etcd.
vault:
  enabled: false
  address: "http://vault.vault.svc.cluster.local:8200"
  k8sMount: "kubernetes"
  k8sRole: "tessera-api"
  databaseMount: "database"
  postgresRole: "tessera-api-postgres"
  redisRole: "tessera-api-redis"
  serviceAccountTokenPath: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  tokenExpirationSeconds: 3600

argo-rollouts:
  enabled: false

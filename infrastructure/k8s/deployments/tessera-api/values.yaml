# -- Tessera API Helm values for Argo Rollouts blue-green / canary deployment.

replicaCount: 3

image:
  repository: ghcr.io/a4-stellar/tessera-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Deployment strategy: "blueGreen" or "canary".
strategy: blueGreen

blueGreen:
  autoPromotionEnabled: false
  autoPromotionSeconds: 120
  scaleDownDelaySeconds: 30
  prePromotionAnalysis: true
  postPromotionAnalysis: false

canary:
  steps:
    - setWeight: 10
    - pause: { duration: 60s }
    - setWeight: 30
    - pause: { duration: 60s }
    - setWeight: 60
    - pause: { duration: 60s }
    - setWeight: 100
  maxSurge: "25%"
  maxUnavailable: 0

analysis:
  enabled: true
  # -- Maximum HTTP 5xx error rate (percentage) before aborting.
  errorRateThreshold: 1.0
  # -- Maximum p95 latency in milliseconds before aborting.
  p95LatencyThresholdMs: 500
  # -- How often to sample metrics during analysis.
  intervalSeconds: 30
  # -- Number of metric samples to collect per analysis run.
  count: 10
  # -- Number of failures allowed before the analysis is considered failed.
  failureLimit: 2
  # -- Prometheus endpoint for metric queries.
  prometheusAddress: http://prometheus.monitoring.svc.cluster.local:9090

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

previewService:
  enabled: true
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

env:
  - name: RUST_LOG
    value: "tessera_api=info,tower_http=info"
  - name: PORT
    value: "8080"

envFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 2

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

argo-rollouts:
  enabled: false

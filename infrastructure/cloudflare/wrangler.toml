name = "tessera-edge-security"
main = "worker.js"
compatibility_date = "2026-09-26"
workers_dev = false

# Change this route if the API hostname differs in your Cloudflare zone.
routes = [{ pattern = "api.tessera.xyz/*", zone_name = "tessera.xyz" }]

[vars]
API_ORIGIN = "https://replace-with-origin.example.com"
ALLOWED_HOSTS = "api.tessera.xyz"
JWT_ISSUER = "tessera-api"
JWT_AUDIENCE = "tessera-api"

[[ratelimits]]
name = "IP_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

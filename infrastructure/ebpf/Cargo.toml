[package]
name = "tessera-ebpf-daemon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "User-space Rust daemon for managing eBPF XDP rate-limiting filters"

[dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
nix = "0.27"
libc = "0.2"

[build-dependencies]
aya-build = "0.13"
# PostgreSQL settings required by the pgBackRest WAL archive (issue #393).
# Include from postgresql.conf:  include = '/etc/postgresql/dr.conf'

# WAL level must be at least 'replica' for a warm standby to replay WAL.
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 2GB
hot_standby = on

# Continuous WAL archiving. pgBackRest fans each segment out to S3 and GCS.
archive_mode = always
archive_command = 'pgbackrest --stanza=prod --repo=1 archive-push %p'

# RPO lever: force a WAL segment switch after at most 5 minutes of inactivity,
# so the recoverable point is never older than the 5-minute RPO target.
archive_timeout = 300

# Restore performance on the warm standby (full_page_writes stays on for safety).
max_wal_size = 4GB
checkpoint_timeout = 5min

# The standby is placed in hot-standby mode with an empty standby.signal file;
# the API's read-only mode is enforced in the ECS task definition as well, so a
# misconfigured client cannot promote the replica. Do NOT set
# default_transaction_read_only here — this file is shared with the primary.

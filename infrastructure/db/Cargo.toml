[package]
name = "tessera-db-sync"
version = "0.1.0"
edition = "2021"
description = "Multi-cloud active-active PostgreSQL synchronization between AWS RDS and GCP Cloud SQL."
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[lib]
name = "active_active_sync"
path = "active_active_sync.rs"

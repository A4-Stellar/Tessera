# pgBackRest repository configuration for Tessera disaster recovery (#393).
#
# Copy to /etc/pgbackrest/pgbackrest.conf on the primary and on the standby.
# Secrets (S3/GCS credentials, repository cipher passphrase) are supplied by
# the environment/IAM role, never committed here. Both cloud repositories are
# configured so a single region or provider outage cannot remove the backup.
#
# RPO target: < 5 minutes. `archive_timeout = 300` in postgresql-dr.conf forces
# a WAL segment switch at most every 5 minutes even on an idle primary;
# `archive_async = y` keeps the archiver off the commit path. pgBackRest then
# pushes each completed segment to both repositories continuously.

[global]
repo1-type = s3
repo1-s3-bucket = tessera-pgbackrest-prod
repo1-s3-region = us-east-1
repo1-s3-endpoint = s3.amazonaws.com
repo1-path = /pgbackrest/tessera-prod
repo1-retention-full = 14
repo1-retention-diff = 7
repo1-bundle = y
repo1-block = y
repo1-cipher-type = aes-256-cbc
repo1-cipher-pass = ${PGBACKREST_CIPHER_PASS}

repo2-type = gcs
repo2-gcs-bucket = tessera-pgbackrest-prod
repo2-path = /pgbackrest/tessera-prod
repo2-retention-full = 14
repo2-retention-diff = 7
repo2-bundle = y
repo2-block = y
repo2-cipher-type = aes-256-cbc
repo2-cipher-pass = ${PGBACKREST_CIPHER_PASS}

# WAL is archived asynchronously to both clouds; the standby's delta restore
# reads from whichever repository answered first.
archive-async = y
spool-path = /var/spool/pgbackrest
start-fast = y
process-max = 4
log-level-console = info
log-level-file = detail
log-path = /var/log/pgbackrest
lock-path = /tmp/pgbackrest

[prod]
pg1-path = /var/lib/postgresql/16/main
pg1-port = 5432
pg1-user = postgres

[global:archive-push]
compress-level = 3

[global:archive-get]
process-max = 2

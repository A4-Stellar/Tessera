# Alertmanager routing for the Tessera API SLO alerts (issue #312).
#
# severity=page   -> PagerDuty (wakes the on-call) AND Slack #tessera-alerts
# severity=ticket -> Slack #tessera-alerts only
#
# No secrets live in this file. Mount them as files (Kubernetes secret,
# Docker secret, or ECS/Cloud Run secret volume) at the paths below:
#   /etc/alertmanager/secrets/pagerduty_routing_key   PagerDuty Events v2 key
#   /etc/alertmanager/secrets/slack_webhook_url       Slack incoming webhook
#
# Validate with: amtool check-config alertmanager.yml

global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, slo]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: pagerduty-and-slack
      repeat_interval: 1h
    - matchers: [severity="ticket"]
      receiver: slack
      repeat_interval: 12h

# While the budget is already exhausted, the fast/slow burn pages for the
# same SLO add noise without new information.
inhibit_rules:
  - source_matchers: [alertname="TesseraApiErrorBudgetExhausted"]
    target_matchers: [alertname=~"TesseraApiErrorBudget(FastBurn|SlowBurn|Low)"]
    equal: [slo]
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [slo]

receivers:
  - name: pagerduty-and-slack
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        send_resolved: true
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          slo: '{{ .CommonLabels.slo }}'
          burn_rate: '{{ .CommonLabels.burn_rate }}'
          window: '{{ .CommonLabels.window }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
    slack_configs: &slack
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: '#tessera-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}*{{ .Labels.severity }}* — {{ .Annotations.description }}
          {{ end }}
          Runbook: {{ .CommonAnnotations.runbook_url }}
  - name: slack
    slack_configs: *slack

# Tessera critical alerts.
#
# Every alert carries:
#   labels.priority         P1..P4. Grafana OnCall routes P1 to the escalation
#                           chain and the triage bot runs the automated runbook
#                           steps (issue #474); see docs/runbooks/automated-triage.md.
#   annotations.runbook_url A file under docs/runbooks/. The triage bot picks
#                           its automated steps from this file name, and
#                           tests/check_runbooks.py fails if the file is missing.
groups:
  - name: tessera-critical
    rules:
      - alert: HighIndexerLag
        expr: tessera_indexer_ledger_lag > 10
        for: 5m
        labels: { severity: critical, priority: P1 }
        annotations:
          summary: Indexer is more than ten ledgers behind
          runbook_url: https://github.com/A4-Stellar/Tessera/blob/main/docs/runbooks/indexer-lag.md
      - alert: HighErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1)) > 0.01
        for: 10m
        labels: { severity: critical, priority: P1 }
        annotations:
          summary: API 5xx error rate exceeds one percent
          runbook_url: https://github.com/A4-Stellar/Tessera/blob/main/docs/runbooks/api-errors.md
      - alert: DatabasePoolExhaustion
        expr: tessera_db_pool_in_use / tessera_db_pool_size > 0.9
        for: 5m
        labels: { severity: warning, priority: P2 }
        annotations:
          summary: Database pool is over 90 percent utilized
          runbook_url: https://github.com/A4-Stellar/Tessera/blob/main/docs/runbooks/database-pool.md
      - alert: SorobanRpcDown
        expr: up{job="soroban-rpc"} == 0
        for: 2m
        labels: { severity: critical, priority: P1 }
        annotations:
          summary: Soroban RPC target is unavailable
          runbook_url: https://github.com/A4-Stellar/Tessera/blob/main/docs/runbooks/soroban-rpc.md

# cargo-deny policy for the API dependency graph.
# Documentation: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Keep unmaintained workspace dependencies blocking; report transitive ones
# without failing on dependencies the project does not select directly.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
    "0BSD"
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# ---------------------------------------------------------------------------
# MACHINE-MANAGED SECTION (scripts/security/audit_crates.py --bot)
# The security remediation bot adds inline-table entries here to DENY crate
# versions with known HIGH/CRITICAL advisories until they are upgraded, e.g.:
#   { name = "example-crate", version = "=1.2.3" }
# Entries are marked with a `# machine-managed by audit_crates.py --bot` comment.
# Do not remove that marker or hand-edit bot-added entries; the bot updates this
# array idempotently and commits the change in the same PR as the version bump.
# ---------------------------------------------------------------------------
deny = []  # machine-managed by audit_crates.py --bot: add { name = "...", version = "=x.y.z" }
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

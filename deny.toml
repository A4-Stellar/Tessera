# cargo-deny policy for the API dependency graph.
# Documentation: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Keep unmaintained workspace dependencies blocking; report transitive ones
# without failing on dependencies the project does not select directly.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
    "0BSD"
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

name: Weekly disaster recovery drill

on:
  schedule:
    # Every Sunday at 03:17 UTC.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dr-drill:
    name: Restore latest WAL and run API smoke tests
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure Google Cloud credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure kubectl for the DR cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.DR_EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Install pgBackRest
        run: sudo apt-get update && sudo apt-get install -y pgbackrest

      - name: Run automated DR drill
        id: drill
        env:
          DR_PGBACKREST_STANZA: ${{ vars.DR_PGBACKREST_STANZA }}
          DR_PGBACKREST_REPO: ${{ vars.DR_PGBACKREST_REPO }}
          DR_S3_BUCKET: ${{ vars.PGBACKREST_S3_BUCKET }}
          DR_GCS_BUCKET: ${{ vars.PGBACKREST_GCS_BUCKET }}
          DR_K8S_NAMESPACE: ${{ vars.DR_K8S_NAMESPACE }}
          DR_API_DEPLOYMENT: ${{ vars.DR_API_DEPLOYMENT }}
          DR_API_URL: ${{ vars.DR_API_URL }}
          DR_API_TOKEN: ${{ secrets.DR_API_TOKEN }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          PAGERDUTY_SERVICE_ID: ${{ vars.PAGERDUTY_SERVICE_ID }}
        run: ./infrastructure/dr/restore_verification.sh --drill

      - name: Upload drill results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-results
          path: /tmp/tessera-dr-drill-*
          if-no-files-found: warn

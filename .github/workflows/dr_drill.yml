name: Weekly disaster recovery drill

on:
  schedule:
    # Every Sunday at 03:17 UTC.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dr-drill:
    name: Restore latest WAL and run API smoke tests
    # pgBackRest restores must run on the database host, so this job runs on a
    # self-hosted runner installed on the DR replica (label: tessera-dr).
    runs-on: [self-hosted, tessera-dr]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure Google Cloud credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install pgBackRest
        run: sudo apt-get update && sudo apt-get install -y pgbackrest

      - name: Run automated DR drill
        id: drill
        # Names match what infrastructure/dr/dr_drill.sh reads.
        env:
          DR_CLUSTER: ${{ vars.DR_ECS_CLUSTER }}
          DR_SERVICE: ${{ vars.DR_ECS_SERVICE }}
          DR_REGION: ${{ vars.AWS_REGION }}
          PGBACKREST_STANZA: ${{ vars.DR_PGBACKREST_STANZA }}
          PGBACKREST_REPO: ${{ vars.DR_PGBACKREST_REPO }}
          STANDBY_HEALTH_URL: ${{ vars.DR_API_URL }}/health
          FAILOVER_WORKER_URL: ${{ vars.DR_FAILOVER_WORKER_URL }}
          FAILOVER_ADMIN_TOKEN: ${{ secrets.FAILOVER_ADMIN_TOKEN }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: ./infrastructure/dr/restore_verification.sh --drill

      - name: Upload drill results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-results
          path: /tmp/tessera-dr-drill*.json
          if-no-files-found: warn

name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path Filtering: Strict separation between Rust and Next.js / Docs subsystems
  # ---------------------------------------------------------------------------
  changes:
    name: Filter Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'api/**'
              - 'contracts/**'
              - 'deny.toml'
              - 'cliff.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/api.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'

  # ===========================================================================
  # RUST PIPELINE (API & Smart Contracts)
  # Uses Swatinem/rust-cache@v2 for dependency and build artifact caching
  # ===========================================================================
  rust-lint:
    name: Rust Lint (fmt & clippy)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Formatting Check
        run: cargo fmt --check
      - name: Clippy Warnings Check
        run: cargo clippy --all-targets -- -D warnings

  rust-test-unit:
    name: Rust Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Run Unit Tests
        run: cargo test --bins

  rust-test-integration:
    name: Rust Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Run Integration Tests
        run: cargo test --test '*' -- --skip testnet_integration

  rust-build:
    name: Rust Compilation & Build
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Build Locked
        run: cargo build --locked
      - name: Build Release Artifact
        run: cargo build --release

  # ===========================================================================
  # DOCS & FRONTEND PIPELINE (Next.js 16 / TypeScript / MDX)
  # Uses actions/cache for Next.js .next/cache and actions/setup-node npm cache
  # ===========================================================================
  docs-lint:
    name: Docs Lint & MDX Verification
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Validate MDX Code Samples
        run: npm run check:mdx-samples
      - name: Run ESLint & Strict a11y Rules
        run: npm run lint

  docs-test-unit:
    name: Docs Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Jest Test Suite
        run: npm test

  docs-test-a11y:
    name: Automated a11y (WCAG 2.1 AA) Audit
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run axe-core Accessibility Tests
        run: npm run test:a11y

  docs-build:
    name: Docs Next.js Build
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('docs/package-lock.json') }}-${{ hashFiles('docs/**/*.{js,jsx,ts,tsx,md,mdx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('docs/package-lock.json') }}-
      - name: Production Next.js Build
        run: npm run build

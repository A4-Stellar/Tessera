name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path Filtering: Strict separation between Rust and Next.js / Docs subsystems
  # ---------------------------------------------------------------------------
  changes:
    name: Filter Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'api/**'
              - 'contracts/**'
              - 'deny.toml'
              - 'cliff.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/api.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'

  # ===========================================================================
  # RUST PIPELINE (API & Smart Contracts)
  # Uses Swatinem/rust-cache@v2 for dependency and build artifact caching
  # ===========================================================================
  rust-lint:
    name: Rust Lint (fmt & clippy)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Formatting Check
        run: cargo fmt --check
      - name: Clippy Warnings Check
        run: cargo clippy --all-targets -- -D warnings

  rust-test-unit:
    name: Rust Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Run Unit Tests
        run: cargo test --bins

  rust-test-integration:
    name: Rust Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Run Integration Tests
        run: cargo test --test '*' -- --skip testnet_integration

  rust-build:
    name: Rust Compilation & Build
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            contracts -> target
      - name: Build Locked
        run: cargo build --locked
      - name: Build Release Artifact
        run: cargo build --release

  # ---------------------------------------------------------------------------
  # Soroban WASM build with a content-addressed cache. Cache hits skip the full
  # contract compile (~8 min); two independent builds are compared byte-for-byte
  # when WASM_REPRODUCIBILITY_CHECK is enabled (issue #47).
  # ---------------------------------------------------------------------------
  wasm-build:
    name: Soroban WASM Build (cached)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Dependency/registry cache (host builds) and the on-disk wasm cache.
      - name: Restore Cargo registry & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore shared WASM cache
        # Coarse GitHub Actions cache key for the on-disk .wasm-cache directory.
        # The bucket-backed custom cache uses the tighter content hash computed
        # by the script (all sources + rustc version + exact CARGO_FLAGS) with a
        # 30-day retention/expiry tag, so cross-run hits are content-exact.
        uses: actions/cache@v4
        with:
          path: contracts/target/.wasm-cache
          key: soroban-wasm-${{ hashFiles('contracts/**/*.rs','contracts/**/Cargo.toml','contracts/Cargo.lock','contracts/rust-toolchain.toml') }}-${{ hashFiles('contracts/rust-toolchain.toml') }}
          restore-keys: |
            soroban-wasm-

      - name: Build Soroban contracts (content-addressed cache)
        # S3/GCS credentials come from OIDC or secrets and are only exposed when
        # a bucket is configured via repository vars — never hardcoded here.
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.WASM_CACHE_BUCKET != '' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.WASM_CACHE_BUCKET != '' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_REGION: ${{ vars.WASM_CACHE_REGION || 'us-east-1' }}
        run: |
          chmod +x scripts/ci/check-wasm-cache.sh
          CARGO_FLAGS="--release --target wasm32-unknown-unknown" CACHE_BUCKET="${{ vars.WASM_CACHE_BUCKET }}" WASM_REPRODUCIBILITY_CHECK="${{ vars.WASM_REPRODUCIBILITY_CHECK || '0' }}" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci/check-wasm-cache.sh

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: warn

      - name: Aggregate WASM cache metrics
        # Final aggregation: fold the per-run metrics into the job summary.
        if: always()
        run: |
          if [ -f .wasm-cache-metrics.json ]; then
            HR="$(sed -n 's/.*"hit_rate":\([0-9]*\).*/\1/p' .wasm-cache-metrics.json)"
            H="$(sed -n 's/.*"hits":\([0-9]*\).*/\1/p' .wasm-cache-metrics.json)"
            T="$(sed -n 's/.*"total":\([0-9]*\).*/\1/p' .wasm-cache-metrics.json)"
            {
              echo "### 📊 WASM cache summary (aggregate)"
              echo "📊 WASM cache hit rate: ${HR:-0}% (${H:-0} hits / ${T:-0} builds)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ No WASM cache metrics file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ===========================================================================
  # SUPPLY CHAIN SECURITY: Cargo Deny & Reproducible WASM Builds (Issue #47)
  # ===========================================================================
  cargo-deny:
    name: Cargo Deny Policy Check (Licenses & Advisories)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Cargo Deny (Licenses, Advisories, Bans, Sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: api/Cargo.toml
          arguments: --config deny.toml

  wasm-reproducible-build:
    name: WASM Reproducible Build (Runner ${{ matrix.runner_instance }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runner_instance: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build Soroban Contracts to WASM
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Compute Deterministic SHA-256 Checksums
        run: |
          mkdir -p checksums
          cd contracts/target/wasm32-unknown-unknown/release
          if ls *.wasm 1> /dev/null 2>&1; then
            sha256sum *.wasm | sort > ../../../../checksums/wasm_checksums_${{ matrix.runner_instance }}.txt
          else
            echo "No wasm files found" > ../../../../checksums/wasm_checksums_${{ matrix.runner_instance }}.txt
          fi
      - name: Upload Runner Checksums
        uses: actions/upload-artifact@v4
        with:
          name: wasm-checksums-${{ matrix.runner_instance }}
          path: checksums/wasm_checksums_${{ matrix.runner_instance }}.txt

  wasm-verify-reproducibility:
    name: Verify WASM Byte-Identical Reproducibility
    needs: wasm-reproducible-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-checksums-1
          path: runner1
      - uses: actions/download-artifact@v4
        with:
          name: wasm-checksums-2
          path: runner2
      - name: Diff Checksums Across Independent Runners
        run: |
          echo "Comparing WASM checksums between independent runners..."
          diff -u runner1/wasm_checksums_1.txt runner2/wasm_checksums_2.txt
          echo "Reproducible build verified: WASM artifacts are byte-identical."

  # ===========================================================================
  # DOCS & FRONTEND PIPELINE (Next.js 16 / TypeScript / MDX)
  # Uses actions/cache for Next.js .next/cache and actions/setup-node npm cache
  # ===========================================================================
  docs-lint:
    name: Docs Lint & MDX Verification
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Validate MDX Code Samples
        run: npm run check:mdx-samples
      - name: Type-check MDX TypeScript Samples
        run: npm run check:mdx-types
      - name: Validate Component JSDoc & Generated Docs
        run: npm run check:component-docs
      - name: Run ESLint & Strict a11y Rules
        run: npm run lint

  docs-test-unit:
    name: Docs Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Jest Test Suite
        run: npm test

  docs-test-a11y:
    name: Automated a11y (WCAG 2.1 AA) Audit
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run axe-core Accessibility Tests
        run: npm run test:a11y

  docs-build:
    name: Docs Next.js Build
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('docs/package-lock.json') }}-${{ hashFiles('docs/**/*.{js,jsx,ts,tsx,md,mdx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('docs/package-lock.json') }}-
      - name: Production Next.js Build
        run: npm run build

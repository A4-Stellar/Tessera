name: Security Analysis & Vulnerability Scan

on:
  push:
    branches: [ main ]
    paths:
      - "api/**"
      - "contracts/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/security.yml"
      - "deny.toml"
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scan every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions:
  # Least privilege for the scanning jobs. The dependency-remediation job
  # below narrows/elevates its own permissions to what the bot needs.
  contents: read
  security-events: write

jobs:
  # Job 1: Rust Supply-Chain & License Analysis (cargo audit + cargo deny)
  rust-security:
    name: Rust Security (Audit & Deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            api
            contracts

      # 1. Cargo Audit for API
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo Audit (API)
        working-directory: api
        run: cargo audit

      # 2. Cargo Deny for Workspace
      - name: Cargo Deny Check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: api/Cargo.toml
          arguments: --config deny.toml

  # Job 2: Node.js Dependency Security Audit
  node-security:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Docs Dependencies
        working-directory: docs
        run: |
          npm audit --audit-level=high

      - name: Audit Synthetic Monitor Dependencies
        working-directory: scripts/synthetic-monitor
        run: |
          npm audit --audit-level=high

  # Job 3: Trivy Container Image & Config Vulnerability Scan
  container-security:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: api
          file: api/Dockerfile
          push: false
          load: true
          tags: tessera-api:security-scan

      - name: Run Trivy Vulnerability Scanner (Table Output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tessera-api:security-scan
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run Trivy Vulnerability Scanner (SARIF Report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tessera-api:security-scan
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

  # Job 4: Static attack-surface scan (issue #139) — Soroban auth/storage
  # checks + REST handler validation, reported as SARIF.
  attack-surface:
    name: Attack Surface Scan (SARIF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run attack-surface scan
        run: python scripts/security/attack_surface_scan.py --output attack-surface.sarif --text
        # Exit code is non-zero on error-level findings; keep the SARIF
        # upload running so results stay visible in the Security tab.
        continue-on-error: true

      - name: Upload Attack Surface SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: attack-surface.sarif
          category: tessera-attack-surface-scan

  # Job 5: Automated dependency remediation (Rust + npm advisories).
  # Only the weekly schedule and manual dispatch open PRs/issues; the push and
  # PR triggers above keep their existing read-only scan behaviour.
  dependency-remediation:
    name: Dependency Remediation Bot
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Write access is scoped to this job only: the bot creates blobs/trees/
    # commits/branches for fix PRs via the Git Data API and opens issues.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The bot needs full history to resolve the base branch commit.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # DRY_RUN: set the repository variable DRY_RUN=true (or append
      # --dry-run to the command below) to make the bot print the PRs/issues
      # and deny.toml edits it *would* make, without any network writes.
      # The maintainer defaults to SECURITY_MAINTAINER / GITHUB_REPOSITORY_OWNER.
      - name: Run dependency remediation bot
        run: python scripts/security/audit_crates.py --bot --repo "${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --maintainer "${{ vars.SECURITY_MAINTAINER || github.repository_owner }}" --base main

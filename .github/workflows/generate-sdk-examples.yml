name: SDK Example Generation

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**/*.rs'
      - 'docs/content/**/*.mdx'
      - 'docs/scripts/generate-sdk-examples.mjs'
      - 'docs/scripts/lib/abi-codegen.mjs'
      - 'sdk/tests/generated/**'
  pull_request:
    paths:
      - 'contracts/**/*.rs'
      - 'docs/content/**/*.mdx'
      - 'docs/scripts/generate-sdk-examples.mjs'
      - 'docs/scripts/lib/abi-codegen.mjs'
      - 'sdk/tests/generated/**'
  workflow_dispatch:

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [typescript, python, go]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          cd docs && npm ci

      - name: Verify committed ABI & SDK generated artifacts have no drift
        run: |
          node docs/scripts/generate-sdk-examples.mjs --check

      - name: Generate SDK examples
        run: |
          node docs/scripts/generate-sdk-examples.mjs

      - name: Run TypeScript tests
        if: matrix.language == 'typescript'
        run: |
          cd docs && npx jest __tests__/abi-codegen.test.ts
          cd ../sdk/typescript && npm ci && npm test

      - name: Run Python tests
        if: matrix.language == 'python'
        run: |
          python3 -m py_compile sdk/tests/generated/python/contract_types.py
          cd sdk/python && pip install -e ".[test]" && pytest tests/ -v

      - name: Run Go tests
        if: matrix.language == 'go'
        run: |
          gofmt -e sdk/tests/generated/go/contract_types.go > /dev/null
          cd sdk/go && go test -v ./...

      - name: Upload generated examples
        uses: actions/upload-artifact@v4
        with:
          name: generated-sdk-examples-${{ matrix.language }}
          path: sdk/tests/generated/${{ matrix.language }}/

[package]
name = "tessera-cap-table"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera cap-table snapshot and Merkle proof verification contract (issue #13)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[package]
name = "tessera-index-token"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera synthetic RWA index token: basket-backed mint/redeem, oracle-priced NAV and streaming management fees."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

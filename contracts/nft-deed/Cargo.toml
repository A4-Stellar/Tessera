[package]
name = "tessera-nft-deed"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera NFT property deed: binds fractional asset tokens to a master NFT representing the legal deed title."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
tessera-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

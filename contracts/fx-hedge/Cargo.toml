[package]
name = "tessera-fx-hedge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Multi-currency dynamic FX hedging pool for international real estate dividend yields."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

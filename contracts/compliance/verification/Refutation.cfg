\* Same model as Gate.cfg, but asserting the NAIVE form of (G1):
\*
\*     \A a \in Addrs : bal[a] > 0 => IsAllowed(a)
\*
\* This is the property the acceptance criteria are most naturally read as
\* ("un-allowlisted addresses can never have a positive balance"), and it is
\* FALSE.  TLC is expected to exit non-zero with a counterexample trace.
\*
\* The exit code is inverted in CI (see verify-tlc.sh): a violation here is the
\* EXPECTED, PASSING outcome, because the purpose of this run is to keep a
\* concrete witness trace in the documentation that the naive property does not
\* hold, rather than to let someone quietly assert it later.
\*
\* If TLC ever reports "no error has been found", the system changed in a way
\* that makes the naive property true, and README.md must be updated: either
\* the property now holds for a new reason, or the model has drifted from the
\* Rust and is no longer faithful.

SPECIFICATION Spec

CONSTANTS
    Addrs  = {a1, a2}
    Juris  = {j1, j2}
    NoAddr = none
    MaxBal = 2
    MaxSeq = 2
    MaxExp = 2

INVARIANT
    PositiveBalanceImpliesAllowed

\* Bounded model for the (G1) gate property and (S1) supply conservation.
\*
\* Bound rationale -- every constant is the SMALLEST value that still reaches
\* the behaviour the properties are about.  TLC exhaustively explores the whole
\* reachable state space, so the constants are chosen to keep CI fast rather
\* than to be "generous":
\*
\*   Addrs  = 2   Three addresses triples every per-address array for no extra
\*                coverage.  Two is enough for a genuine cross-party transfer
\*                and for clawback-after-revocation; the self-transfer path is
\*                covered by the dedicated `SelfTransfer` action, not by
\*                picking f = t inside `Transfer`.
\*   Juris  = 2   One jurisdiction makes block/unblock a no-op, so two is the
\*                minimum that exercises jurisdiction-based revocation.
\*   MaxBal = 2   Reaches the overflow-rejection branch: total = 2 with
\*                Mint(_, 1) tries to write 3 and must be refused.
\*   MaxSeq = 2   Reaches a KYC record created at seq 0 with exp 1 and then
\*                expiring at seq 1, and reaches a lockup of 1 releasing at
\*                seq 1.
\*   MaxExp = 2   As above: 0 = "never expires", 1 and 2 are expiring records.
\*
\* No symmetry set is declared. `Addrs` and `Juris` are model values and TLC's
\* symmetry reduction would be sound, but at this size it costs more in
\* confusion when a trace is reported than it saves in time.

SPECIFICATION Spec

CONSTANTS
    Addrs  = {a1, a2}
    Juris  = {j1, j2}
    NoAddr = none
    MaxBal = 2
    MaxSeq = 2
    MaxExp = 2

INVARIANTS
    TypeOK
    NoUngatedCredit
    SupplyConserved
    NoMonetaryDrift
    NoNegativeBalances
    NoPhantomSupply
    TransferGate
    MintGate
    InitializeGate
    SelfTransferGate
    ClawbackNotGated

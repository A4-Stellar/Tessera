[package]
name = "tessera-compliance"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera RWA compliance contract: KYC allowlist and jurisdiction gating."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
tessera-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

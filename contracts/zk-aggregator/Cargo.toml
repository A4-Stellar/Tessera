[package]
name = "tessera-zk-aggregator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Off-chain KYC proof aggregator for the Tessera compliance contract (issue #317)."

[[bin]]
name = "tessera-zk-aggregator"
path = "src/main.rs"

[dependencies]
ark-bn254 = "0.4"
ark-crypto-primitives = { version = "0.4", default-features = false, features = ["sponge", "crh", "r1cs"] }
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = { version = "0.4", default-features = false }
ark-r1cs-std = { version = "0.4", default-features = false }
ark-relations = { version = "0.4", default-features = false }
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
hex = "0.4"
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stellar-strkey = "0.0.13"

# Proving is far too slow unoptimized; keep test builds usable.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

# Standalone package, like `fuzz/` and `verification/`: its prover
# dependencies must not leak into the wasm-targeted contracts workspace.
[workspace]

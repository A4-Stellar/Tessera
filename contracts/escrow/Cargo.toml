[package]
name = "tessera-escrow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera multi-party threshold escrow with time-based dispute resolution."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[package]
name = "tessera-flash-loan"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera Cross-Asset Flash Loan Verification Engine for Compliance-Gated RWA Tokens."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

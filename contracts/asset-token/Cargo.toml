[package]
name = "tessera-asset-token"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera RWA asset-token contract: compliance-gated fungible token for a tokenized asset."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
tessera-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

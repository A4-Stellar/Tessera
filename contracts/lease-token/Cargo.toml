[package]
name = "tessera-lease-token"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera On-Chain Real Estate Lease Tokenization & Automated Rental Sweep Vault."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[package]
name = "tessera-insurance"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tessera property insurance claim escrow and payout pool with 3-of-5 arbiter multi-sig."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

# Standalone package, for the same reason as `fuzz/proptests`: `proptest`
# must run on stable and must not be pulled into the wasm-targeted workspace
# build. `contracts/Cargo.toml` excludes it.
[workspace]

[package]
name = "tessera-verification"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Formal state-invariant verification and Kani proof harnesses for the Tessera Soroban contract suite (issues #296, #369)."

[dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
proptest = "1"

tessera-registry = { path = "../registry" }
tessera-compliance = { path = "../compliance" }
tessera-asset-token = { path = "../asset-token" }
tessera-dividend = { path = "../dividend" }

[profile.test]
opt-level = 0
debug-assertions = true
overflow-checks = true

[profile.release]
debug-assertions = true
overflow-checks = true

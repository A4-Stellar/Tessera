plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.a4-stellar'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

    // Spring WebFlux & Project Reactor
    api 'org.springframework:spring-webflux:6.1.12'
    api 'io.projectreactor:reactor-core:3.6.9'

    // RSocket
    api 'io.rsocket:rsocket-core:1.1.4'
    api 'io.rsocket:rsocket-transport-netty:1.1.4'

    // Resilience4j
    api 'io.github.resilience4j:resilience4j-reactor:2.2.0'
    api 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    api 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'
    api 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'io.projectreactor:reactor-test:3.6.9'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'io.github.a4-stellar'
            artifactId = 'tessera-java-sdk'
            version = '0.1.0'

            pom {
                name = 'Tessera Java SDK'
                description = 'Official Java/Kotlin client for the Tessera real-world asset (RWA) indexing API on Stellar: Spring WebFlux WebClient, RSocket event streaming, Resilience4j integration, Jackson-annotated models.'
                url = 'https://github.com/A4-Stellar/Tessera'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Tessera Contributors'
                        organization = 'A4-Stellar'
                        organizationUrl = 'https://github.com/A4-Stellar'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/A4-Stellar/Tessera.git'
                    developerConnection = 'scm:git:ssh://git@github.com/A4-Stellar/Tessera.git'
                    url = 'https://github.com/A4-Stellar/Tessera/tree/main/sdk/java'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'OSSRH'
            def releasesRepoUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = System.getenv('OSSRH_USERNAME') ?: 'dummy'
                password = System.getenv('OSSRH_PASSWORD') ?: 'dummy'
            }
        }
    }
}

signing {
    required { !version.endsWith('SNAPSHOT') && gradle.taskGraph.hasTask('publish') }
    def signingKey = System.getenv('GPG_SIGNING_KEY')
    def signingPassword = System.getenv('GPG_SIGNING_PASSWORD')
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

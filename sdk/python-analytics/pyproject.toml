[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tessera-analytics"
dynamic = ["version"]
description = "Python data analytics library for quantitative financial modeling, cap-table analysis, and yield forecasting on the Tessera RWA platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Afolabi", email = "afolabiaderonke1995@gmail.com" },
]
keywords = ["stellar", "soroban", "rwa", "analytics", "pandas", "polars", "pyarrow", "financial", "quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pandas",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "polars>=0.20,<1",
    "pyarrow>=14,<18",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "plotly>=5.18,<6",
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = [
    "flit>=3.9,<4",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.8,<1",
    "mypy>=1.10,<2",
]
dev = [
    "jupyter>=1.0,<2",
    "ipywidgets>=8.1,<9",
    "notebook>=7.0,<8",
]

[project.urls]
Repository = "https://github.com/A4-Stellar/Tessera"

[tool.flit.module]
name = "tessera_analytics"

[tool.flit.sdist]
include = ["README.md", "src/tessera_analytics/py.typed", "tests/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tessera-sdk"
dynamic = ["version"]
description = "Async Python client for the Tessera Stellar RWA API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Afolabi", email = "afolabiaderonke1995@gmail.com" },
]
keywords = ["stellar", "soroban", "rwa", "sdk", "api", "async"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.0,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
  "flit>=3.9,<4",
  "mypy>=1.10,<2",
  "numpy<2.5; python_version >= '3.11'",
  "pandas-stubs>=2.2,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.8,<1",
]

[project.urls]
Repository = "https://github.com/devJaja/Tessera"

[tool.flit.module]
name = "tessera_sdk"

[tool.flit.sdist]
include = ["README.md", "src/tessera_sdk/py.typed", "tests/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
python_version = "3.10"
strict = true

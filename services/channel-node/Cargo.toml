[package]
name = "channel-node"
version = "0.1.0"
edition = "2021"
description = "Off-chain Layer-2 state channel daemon for high-frequency micropayment streaming with Ed25519 signature exchange"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.0"
serde_bytes = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
tokio-tungstenite = "0.23"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"

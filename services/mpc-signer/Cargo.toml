[package]
name = "mpc-signer"
version = "0.1.0"
edition = "2021"
description = "Secure Multi-Party Computation (MPC) 2-of-3 Threshold Key Management Service for Stellar admin transactions"
authors = ["Ranjeet2063 <ranjeet2063@users.noreply.github.com>"]
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curve25519-dalek = { version = "4", features = ["rand_core", "serde"] }
ed25519-dalek = { version = "2", default-features = false }
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
